org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
# The fork's application id, in one place so a rename is one line (docs/fork.md). The
# namespace and the Java package stay upstream's org.nvforever.android; only the installed
# package differs, so this fork's APK upgrades this fork's install and never upstream's.
nvfApplicationId=org.nvforever.android.odin
# The version this build calls itself when no tag names one. `-odin.<n>` is the fork's
# revision: it decides the Android versionCode (app/build.gradle), so raise it for every
# build the owner installs.
nvfAndroidVersionName=0.8.1-odin.32
