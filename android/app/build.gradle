plugins { id 'com.android.application' }

// Monotonic Android versionCode for downgrade protection: explicit NVF_ANDROID_VERSION_CODE
// or -PnvfAndroidVersionCode wins; otherwise derive from versionName
// (major*10_000_000 + minor*100_000 + patch*1_000 + androidRevision).
def resolvedVersionName = providers.environmentVariable('NVF_ANDROID_VERSION_NAME')
    .orElse(providers.gradleProperty('nvfAndroidVersionName'))
    .getOrElse('0.7.0-android-r10')
def explicitVersionCode = providers.environmentVariable('NVF_ANDROID_VERSION_CODE')
    .orElse(providers.gradleProperty('nvfAndroidVersionCode'))
    .orNull
// The fork's application id is one Gradle property (gradle.properties `nvfApplicationId`),
// so renaming the installed package is one line; the namespace and the Java package stay
// upstream's (docs/fork.md).
def resolvedApplicationId = providers.gradleProperty('nvfApplicationId')
    .getOrElse('org.nvforever.android')
// Whether the libadrenotools sources are in place (see the externalNativeBuild block below).
def adrenotoolsPresent = file('src/main/cpp/libadrenotools/CMakeLists.txt').exists()
def deriveVersionCode = { String name ->
    // `-odin.<n>`, `-test.<n>` and `-rc.<n>` are the fork's revisions and count exactly as
    // upstream's `-android-r<n>`. A plain `x.y.z` release sorts after every revision of its
    // version (999), so a release always installs over the tests that led to it.
    def m = (name =~ /^v?(\d+)\.(\d+)\.(\d+)(-(?:android-r|odin\.|test\.|rc\.)(\d+))?/)
    if (!m.find()) {
        throw new GradleException("Cannot derive monotonic versionCode from versionName '${name}'; set NVF_ANDROID_VERSION_CODE")
    }
    int major = m.group(1) as int
    int minor = m.group(2) as int
    int patch = m.group(3) as int
    int rev = m.group(4) ? (m.group(5) as int) : 999
    return major * 10000000 + minor * 100000 + patch * 1000 + rev
}
def resolvedVersionCode = explicitVersionCode != null
    ? (explicitVersionCode as int)
    : deriveVersionCode(resolvedVersionName)
if (resolvedVersionCode <= 1) {
    throw new GradleException("Android versionCode must be > 1 (got ${resolvedVersionCode})")
}

android {
    namespace 'org.nvforever.android'
    compileSdk 35
    defaultConfig {
        applicationId resolvedApplicationId
        minSdk 29
        targetSdk 35
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        ndk { abiFilters 'arm64-v8a' }
    }
    // libadrenotools and its hook libraries, for the launcher's optional Graphics driver
    // choice (src/main/cpp/CMakeLists.txt, docs/odin-drivers.md). Its sources are never
    // committed: the fork's workflow downloads them at pinned commits into
    // src/main/cpp/libadrenotools/ before this build runs. Without them there is no native
    // build at all, so a local `gradle assembleDebug` works exactly as it did and the APK
    // simply carries no libadrenotools.
    if (adrenotoolsPresent) {
        // The NDK AGP builds the C/C++ with. Without this AGP wants its own default version,
        // which is not the one CI installs (NDK_VERSION in .github/workflows/fork-android.yml).
        // It matters only here: with no native build AGP never looks for an NDK at all.
        def pinnedNdk = providers.environmentVariable('NDK_VERSION').orNull
        if (pinnedNdk != null) ndkVersion = pinnedNdk
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
        defaultConfig {
            externalNativeBuild {
                cmake {
                    // The NDK's default for CMake, named rather than assumed: libadrenotools
                    // and its hook library each carry their own copy, which is what the
                    // private linker namespace the hooks live in needs. And 16 KB pages, as
                    // the engine's own library already is and as the workflow checks every
                    // packaged library for; NDK 28 does this anyway, asked for by name so the
                    // build does not depend on that staying the default.
                    arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                }
            }
        }
    }
    // Only this repository's runtime data and Classic casing artwork. No game data.
    sourceSets.main.assets.srcDirs = ['../../runtime-assets']
    sourceSets.main.jniLibs.srcDirs = ['../../native-libs']
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        release { minifyEnabled false }
        // The debug variant is a separate installed package (`.debug`), so it sits beside the
        // build being played and has app storage, and therefore saves, of its own; both
        // variants package the same native library, built with the same Rust profile
        // (docs/fork.md, "Debug and release").
        debug { applicationIdSuffix '.debug'; debuggable true }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Binary distributions carry the same licence notices as desktop release archives.
def legalAssets = layout.buildDirectory.dir('generated/legal-assets')
android.sourceSets.main.assets.srcDir(legalAssets)
def stageLegalAssets = tasks.register('stageLegalAssets', Exec) {
    outputs.dir(legalAssets)
    // Regenerate with the exact resolved native dependency graph and source revision.
    outputs.upToDateWhen { false }
    doFirst {
        def ndk = providers.environmentVariable('ANDROID_NDK_HOME').orNull
        if (ndk == null) throw new GradleException('Set ANDROID_NDK_HOME or build with tools/android/build.py')
        commandLine providers.environmentVariable('NVF_PYTHON').getOrElse('python3'),
            rootProject.file('../tools/android/legal_assets.py'), '--ndk', ndk,
            '--out', legalAssets.get().asFile
    }
    doLast {
        // A Java-only support APK can retain an already-qualified native library pair.
        // Its native source identity is separate from this APK's corresponding source.
        def nativeSource = providers.environmentVariable('NVF_ANDROID_NATIVE_SOURCE').orNull
        def destination = legalAssets.get().file('NATIVE-SOURCE.txt').asFile
        if (nativeSource != null) {
            if (!(nativeSource ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid native source revision')
            destination.text = "Native libraries corresponding source:\nhttps://github.com/LootJunkieAzza/NVForever/tree/${nativeSource}\n"
        } else if (destination.exists() && !destination.delete()) {
            throw new GradleException('Cannot remove stale native source identity')
        }
    }
}
tasks.configureEach {
    if ((name.startsWith('merge') && name.endsWith('Assets'))
            || name.startsWith('lint')
            || (name.startsWith('generate') && name.contains('Lint'))) dependsOn(stageLegalAssets)
}
