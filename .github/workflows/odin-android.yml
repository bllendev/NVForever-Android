name: Odin Android debug
on:
  workflow_dispatch:
  push:
    branches: ['odin/**']
    tags: ['odin-v*']

permissions:
  contents: read

jobs:
  apk:
    if: github.repository == 'bllendev/NVForever-Android' && (startsWith(github.ref, 'refs/heads/odin/') || startsWith(github.ref, 'refs/tags/odin-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NDK_VERSION: '28.2.13676358'
      BUILD_TOOLS: '35.0.0'
      # The CMake the SDK ships, for libadrenotools (android/app/src/main/cpp/CMakeLists.txt);
      # app/build.gradle.kts asks for this same version.
      CMAKE_VERSION: '3.22.1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Set up Android and Rust
        run: |
          sdkmanager "platforms;android-35" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: engine -> target
          shared-key: odin-arm64
          save-if: ${{ startsWith(github.ref, 'refs/heads/odin/') }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Test debug report export
        run: |
          mkdir -p "$RUNNER_TEMP/nvf-report-tests"
          javac -d "$RUNNER_TEMP/nvf-report-tests" android/app/src/main/java/org/nvforever/android/DebugReport.java android/tests/DebugReportTest.java
          java -cp "$RUNNER_TEMP/nvf-report-tests" org.nvforever.android.DebugReportTest
      # The launcher's own logic: data profiles, the Data folder check, the controls file
      # and the last-run state. Plain Java, no Android around it (android/tests).
      - name: Test launcher logic
        run: |
          mkdir -p "$RUNNER_TEMP/nvf-launcher-tests"
          javac -d "$RUNNER_TEMP/nvf-launcher-tests" \
            android/app/src/main/java/org/nvforever/android/DataCheck.java \
            android/app/src/main/java/org/nvforever/android/Profiles.java \
            android/app/src/main/java/org/nvforever/android/ControlsFile.java \
            android/app/src/main/java/org/nvforever/android/RunState.java \
            android/tests/LauncherTest.java
          java -cp "$RUNNER_TEMP/nvf-launcher-tests" org.nvforever.android.LauncherTest
      - name: Check string resources
        run: python3 android/tools/check_strings.py
      - name: Check Android input adapter
        run: cargo test --locked --manifest-path engine/Cargo.toml -p nvf-android-input
      - name: Build native ARM64 library
        working-directory: engine
        env:
          CARGO_PROFILE_RELEASE_QUICK_STRIP: symbols
          CARGO_PROFILE_RELEASE_QUICK_DEBUG: 'false'
        run: cargo ndk -t arm64-v8a --platform 26 -o ../android/app/src/main/jniLibs build --locked --profile release-quick -p nvf-android
      # The Khronos Vulkan validation layer (Apache-2.0), for the launcher's "Crash test:
      # Vulkan validation (slow)" switch. The binary is never committed: it is downloaded
      # from the Khronos release, checked against pinned hashes, and only the arm64-v8a
      # library is unpacked beside libnvf_android.so (docs/odin-debug.md).
      - name: Add the Khronos Vulkan validation layer
        env:
          VVL_URL: https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-1.4.363.1/android-binaries-1.4.363.1.zip
          VVL_ZIP_SHA256: 2c17b00a95b18fd63244b27332ef86f45c9269769f798a6261ce80b869c41af4
          VVL_SO_SHA256: 7d36b66e72fd11270fba96de10002256ba95c8408047a8167e636673c16760ae
          VVL_MEMBER: android-binaries-1.4.363.1/arm64-v8a/libVkLayer_khronos_validation.so
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/vvl-android.zip"
          libs=android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL --retry 3 --retry-all-errors -o "$zip" "$VVL_URL"
          echo "$VVL_ZIP_SHA256  $zip" | sha256sum -c -
          unzip -o -j "$zip" "$VVL_MEMBER" -d "$libs"
          echo "$VVL_SO_SHA256  $libs/libVkLayer_khronos_validation.so" | sha256sum -c -
      # libadrenotools (BSD-2-Clause) and its liblinkernsbypass submodule (BSD-2-Clause), for
      # the launcher's optional "Graphics driver" choice: a Mesa Turnip build the player
      # installs themselves (docs/odin-debug.md). No driver is downloaded or shipped, only
      # this loader. Neither source tree is committed: both are fetched at a pinned commit,
      # checked against a pinned hash, and built by Gradle's CMake
      # (android/app/src/main/cpp/CMakeLists.txt).
      - name: Add the libadrenotools sources
        env:
          ADRENOTOOLS_COMMIT: 8fae8ce254dfc1344527e05301e43f37dea2df80
          ADRENOTOOLS_SHA256: ceffce971676d4cfdf348a082df06fc92a1dca6d95bea892a480d63f200961cb
          LINKERNSBYPASS_COMMIT: aa3975893d83ef1bc84c321ec60c65fbf1287887
          LINKERNSBYPASS_SHA256: da1128c8aa771c4d24766b53a47822d0717baa5c536ca8491220402942b80638
        run: |
          set -euo pipefail
          cpp=android/app/src/main/cpp
          src="$cpp/libadrenotools"
          rm -rf "$src"
          mkdir -p "$src/lib/linkernsbypass"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/adrenotools.tar.gz" \
            "https://codeload.github.com/bylaws/libadrenotools/tar.gz/$ADRENOTOOLS_COMMIT"
          echo "$ADRENOTOOLS_SHA256  $RUNNER_TEMP/adrenotools.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/adrenotools.tar.gz" -C "$src" --strip-components=1
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/linkernsbypass.tar.gz" \
            "https://codeload.github.com/bylaws/liblinkernsbypass/tar.gz/$LINKERNSBYPASS_COMMIT"
          echo "$LINKERNSBYPASS_SHA256  $RUNNER_TEMP/linkernsbypass.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/linkernsbypass.tar.gz" -C "$src/lib/linkernsbypass" --strip-components=1
          test -f "$src/CMakeLists.txt" && test -f "$src/lib/linkernsbypass/CMakeLists.txt"
          # BSD-2-Clause asks that the notice travel with a binary distribution, so it goes
          # beside the APK in the artifact and in the release (LEGAL.md).
          mkdir -p dist
          cp "$src/LICENSE" dist/LICENSE.libadrenotools.txt
          cp "$src/lib/linkernsbypass/LICENSE" dist/LICENSE.liblinkernsbypass.txt
      - name: Package APK
        run: gradle -p android --no-daemon -PprebuiltRust assembleDebug
      - name: Sign APK with the dedicated Odin key
        env:
          ODIN_KEYSTORE_B64: ${{ secrets.ODIN_KEYSTORE_B64 }}
        run: |
          umask 077
          ks=$(mktemp)
          trap 'rm -f "$ks"' EXIT
          test -n "$ODIN_KEYSTORE_B64"
          printf '%s' "$ODIN_KEYSTORE_B64" | base64 -d > "$ks"
          unset ODIN_KEYSTORE_B64
          mkdir -p dist
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$ks" --ks-type PKCS12 --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false \
            --out dist/NVForever-Odin-arm64.apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify package and signature
        run: |
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          cd dist
          "$tools/zipalign" -c -P 16 4 NVForever-Odin-arm64.apk
          "$tools/apksigner" verify --verbose --print-certs NVForever-Odin-arm64.apk | tee signer.txt
          grep -q 'SHA-256 digest: 50ce2c81a82786f46813a83873df575fccd5c6f236fcef009e99e974324388b1' signer.txt
          # Both packaged libraries are 16 KB-page aligned: the engine, and the Khronos
          # validation layer (checked, not assumed: its LOAD alignment is 16384 too).
          for so in ../android/app/src/main/jniLibs/arm64-v8a/libnvf_android.so \
                    ../android/app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so; do
            readelf -lW "$so" | awk '$1 == "LOAD" { count++; if (strtonum($NF) < 16384) bad=1 } END { exit (!count || bad) }'
          done
          # The layer must reach the APK, and the libraries must be extracted at install time
          # or Android's Vulkan loader cannot see the layer (app/build.gradle.kts).
          unzip -l NVForever-Odin-arm64.apk | grep -q 'lib/arm64-v8a/libVkLayer_khronos_validation.so'
          # A custom driver only works if nothing pulls the system Vulkan loader into the
          # process first, so the engine must not link it: wgpu loads it at run time, and on
          # Android it may instead be handed the driver's own entry point
          # (engine/nvf-android/src/gpu_driver.rs).
          if readelf -dW ../android/app/src/main/jniLibs/arm64-v8a/libnvf_android.so | grep -q 'NEEDED.*libvulkan'; then
            echo 'libnvf_android.so links libvulkan.so; a player-supplied driver cannot be used' >&2
            exit 1
          fi
          # libadrenotools and all four of its hook libraries must reach the APK as files, or
          # the launcher's Graphics driver choice silently has nothing to load
          # (docs/odin-debug.md). They are built by Gradle's CMake, so they are checked inside
          # the package, and for the same 16 KB page alignment as the two above.
          libs="$RUNNER_TEMP/adrenotools-libs"
          rm -rf "$libs"
          for so in libadrenotools.so libhook_impl.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
            unzip -o -j NVForever-Odin-arm64.apk "lib/arm64-v8a/$so" -d "$libs"
            readelf -lW "$libs/$so" | awk '$1 == "LOAD" { count++; if (strtonum($NF) < 16384) bad=1 } END { exit (!count || bad) }'
          done
          "$tools/aapt2" dump badging NVForever-Odin-arm64.apk | tee package.txt
          grep -q "package: name='org.nvforever.android.odin'" package.txt
          grep -q "native-code: 'arm64-v8a'" package.txt
          "$tools/aapt2" dump xmltree NVForever-Odin-arm64.apk --file AndroidManifest.xml > manifest.txt
          grep -Eq 'extractNativeLibs[^=]*=(true|0xffffffff)' manifest.txt
          sha256sum NVForever-Odin-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odin-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/odin-v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: odin-arm64-${{ github.run_number }}
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" NVForever-Odin-arm64.apk SHA256SUMS.txt signer.txt package.txt \
            LICENSE.libadrenotools.txt LICENSE.liblinkernsbypass.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "NVForever Odin debug $GITHUB_REF_NAME" \
            --notes "Experimental Android ARM64 build. Requires your own clean Fallout: New Vegas Data folder. Includes no game files. Separate app from GameNative and the older Android ports. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
