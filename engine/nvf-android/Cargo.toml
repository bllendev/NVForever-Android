# NVForever on Android. Milestone 2: the whole game (the `nvforever` library, the same code
# as the desktop program) starts in the Android activity, with touch controls, the Android
# folders and the schemas packed inside the library. See docs/android/milestone-2.md.
[package]
name = "nvf-android"
description = "NVForever on Android: the cdylib the APK loads (Milestone 2: the full game)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
# `libnvf_android.so`: loaded by the Android activity, which calls `android_main`
# (generated by `#[bevy_main]` in src/lib.rs). No `main` binary on Android.
name = "nvf_android"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
nvf-android-input = { path = "../nvf-android-input" }
nvf-play.workspace = true
bevy.workspace = true
# The whole game: `nvforever::run_with` is what the desktop program's `main` calls too.
nvforever = { path = "../nvforever" }
# Checks the game folder before the game starts (the same checks the game itself makes).
fnv-install.workspace = true
# The same virtual file system the desktop game reads Data\ through (BSA archives + loose
# files); used by the diagnostic screen's data probe (src/probe.rs).
fnv-vfs.workspace = true

# Already in the build through Bevy (Cargo.lock), listed here for the stdout/stderr -> logcat
# bridge (src/logcat.rs). Android only.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
# blake3 (pulled in by Bevy) compiles hand-written C/assembly for NEON unless told not to.
# `pure` = its portable Rust implementation: no C compiler needed for this crate, same hashes,
# slightly slower hashing (not a bottleneck here). Android only, so desktop builds are unchanged.
blake3 = { version = "1", features = ["pure"] }

[features]
# Exactly one activity backend, never both (android-activity refuses to link two).
# NativeActivity: pure Rust, no Java/C++ glue, simplest toolchain. Verified in M1.
# GameActivity: Google's recommended one (soft keyboard / IME, better input). Needs the
# NDK's C++ toolchain and the Java glue in android/app; the switch is planned if typing
# (console, character name) turns out not to work with NativeActivity's keyboard events.
default = ["native-activity"]
native-activity = ["bevy/android-native-activity"]
game-activity = ["bevy/android-game-activity"]
